<div class="demo-bar"><span class="demo-dot"></span><strong>Демонстрация</strong><span>· Роли переключаются без входа · Все сотрудники и данные вымышлены</span></div>
<header class="top"><div class="top-inner"><div class="brand"><span class="brand-icon" aria-hidden="true">н</span>новичок<span>хороший старт вместе</span></div><nav class="roles" aria-label="Демонстрационная роль"><button data-role="employee" class="active" aria-pressed="true">Новичок</button><button data-role="hr" aria-pressed="false">HR</button></nav></div></header>
<main class="wrap"><div id="error" role="alert" class="error-panel"></div><div id="app"><p class="loading">Готовим демонстрацию…</p></div><footer><span>Новичок · Поддержка в первые месяцы работы</span><span>Помогаем замечать трудности. Влияние на увольнения ещё предстоит проверить.</span></footer></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), app=$('#app');
function icon(kind){return '<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="'+(kind==='check'?'M5 12l4 4L19 6':'M6 18L18 6M6 6h12v12')+'"/></svg>'}
const state={role:'employee',tab:'reports',selected:null,filter:'all',employee:null,hr:null,mode:'named',receipt:null,pending:{},drafts:{},dirty:{},loadError:{}};
const statusNames={new:'Новое',work:'В работе',check:'Ждём проверки',resolved:'Решено'};
const questions=['Понятно ли, что нужно делать?','Получается ли выполнять работу?','Совпадают ли условия с обсуждёнными при найме?'];
const options=[['Всё понятно','Частично','Нужна помощь'],['Да','Есть сложности','Пока не получается'],['Да','Есть расхождения','Пока сложно сказать']];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'}).format(new Date(d+'T12:00:00Z')):'—';
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Moscow'}).format(new Date());
function tomorrow(){const d=new Date(today()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)}
const badge=r=>'<span class="tag '+r.status+'">'+statusNames[r.status]+'</span>';
const empty=(title,description)=>'<div class="empty"><span class="empty-icon" aria-hidden="true">'+icon('arrow')+'</span><strong>'+title+'</strong><br>'+description+'</div>';
function notify(message,error=false){const el=$('#toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.className='toast',6500)}
async function api(path,body,anonymous=false){
  let response;try{response=await fetch('/api/'+path,body===undefined?{cache:'no-store'}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),cache:'no-store',credentials:anonymous?'omit':'same-origin',referrerPolicy:'no-referrer'});}catch{throw new Error('Не удалось связаться с сервером. Проверьте интернет и попробуйте ещё раз. Текст остался в форме.')}
  let data;try{data=await response.json()}catch{throw new Error('Сервер недоступен. Проверьте подключение и повторите. Ваш текст пока остаётся в форме.')}
  if(!response.ok)throw new Error(data.error||'Не удалось выполнить действие.');return data;
}
function formKey(f){return f.id||(f.dataset.help?'help:'+f.dataset.help:f.dataset.process?'process:'+f.dataset.process:f.dataset.manage?'manage:'+f.dataset.manage:'')}
function saveDrafts(){document.querySelectorAll('#app form').forEach(f=>{const key=formKey(f);if(!key)return;if(f.dataset.saved||!f.dataset.dirty){delete state.drafts[key];return}state.drafts[key]=Object.fromEntries(new FormData(f))})}
function restoreDrafts(){document.querySelectorAll('#app form').forEach(f=>{const d=state.drafts[formKey(f)];if(!d)return;f.dataset.dirty='true';for(const el of f.elements){if(!el.name)continue;if(el.type==='radio'||el.type==='checkbox')el.checked=d[el.name]===el.value;else if(Object.hasOwn(d,el.name))el.value=d[el.name]}})}
async function loadRole(role){
 if(state.pending[role])return state.pending[role];
 state.pending[role]=api(role==='employee'?'employee':'hr').then(data=>{state[role]=data;delete state.loadError[role]}).finally(()=>delete state.pending[role]);
 return state.pending[role];
}
async function refresh(){await loadRole(state.role);render()}
function answerList(r,title){return '<div class="survey-answers"><h3 data-copy-allow>'+title+'</h3><dl>'+r.answers.map((a,i)=>'<dt>'+esc(questions[i])+'</dt><dd>'+esc(a)+'</dd>').join('')+'</dl></div>'}
function intro(hr){return '<section class="intro"><div><div class="eyebrow">'+(hr?'Рабочее пространство HR':'Мы здесь, чтобы помочь вам')+'</div><h1>'+(hr?'От сообщения —<br>к реальной помощи.':'Хороший старт в карьере<br>начинается с диалога')+'</h1><p>'+(hr?'Заметьте сложность, договоритесь об исправлении и проверьте, что оно помогло.':'Ответьте, пожалуйста, на несколько коротких вопросов. Если что-то мешает, давайте разберёмся вместе.')+'</p></div></section>'+(hr?'<div class="journey" aria-label="Этапы помощи"><span><b>1</b> Сообщить</span><i></i><span><b>2</b> Исправить</span><i></i><span><b>3</b> Проверить</span><i></i><span><b>4</b> Закрепить</span></div>':'')}
function terms(e){return '<dl class="terms"><dt>Обязанности</dt><dd>'+esc(e.duties)+'</dd><dt>График</dt><dd>'+esc(e.schedule)+'</dd><dt>Оплата</dt><dd>'+esc(e.pay)+'</dd></dl>'}
function renderEmployee(){
  const {employee:e,reports,survey}=state.employee;
  return intro(false)+submissionReceipt()+'<div class="grid"><div class="stack"><section class="card card-pad"><div class="card-head"><div><h2>Как проходят ваши рабочие дни?</h2><p class="muted small space-top no-margin">Три вопроса · около минуты</p></div><span class="tag" data-copy-allow>Опрос для новичков</span></div>'+
  (e.departed?'<div class="warning">В демо отмечено увольнение. Опрос недоступен, именная история сохранена. Причина увольнения неизвестна.</div>':
  '<form id="survey-form">'+questions.map((q,i)=>'<fieldset class="question"><legend>'+q+'</legend><div class="choices">'+options[i].map((o,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'" required><span>'+o+'</span></label>').join('')+'</div></fieldset>').join('')+
  '<label class="field" for="comment">Что было неудобно или мешало работать?<span class="optional">необязательно</span><span class="hint">Если нужна помощь, напишите, какая. Вы можете отправить свой ответ анонимно.</span><textarea id="comment" name="comment" maxlength="2000" placeholder="Например: обсуждали график до 18:00, а в расписании стоят вечерние смены…"></textarea></label><div class="send-mode"><h3>Как отправить ответ?</h3><div class="mode-options"><label class="mode"><input type="radio" name="mode" value="named" checked><span><strong>С именем</strong><small>HR увидит Илью Макарова и сможет связаться.</small></span></label><label class="mode"><input type="radio" name="mode" value="anonymous"><span><strong>Анонимно</strong><small>Ваше имя не передаётся HR.</small></span></label></div><div id="privacy" class="privacy">'+privacy('named')+'</div><div class="submit-row"><button type="button" class="btn ghost" data-example>Показать пример заполнения</button><button class="btn" type="submit" id="send-button">Отправить с именем '+icon('arrow')+'</button></div></div></form>')+'</section><section class="card card-pad"><div class="card-head"><div><h2>Мои обращения</h2><p class="muted small space-top">Здесь только сообщения, отправленные с именем.</p></div><span class="tag">'+reports.length+'</span></div>'+ (reports.length?reports.map(employeeReport).join(''):empty('Пока нет именных обращений','Здесь появятся ваши сообщения. Когда проблема решится, вы сможете отметить это.'))+'</section></div><aside class="stack"><section class="card card-pad" data-employee-card><div class="section-title">Сотрудник</div><div class="profile"><span class="avatar" aria-hidden="true">ИМ</span><div><h3>'+esc(e.name)+'</h3><p>'+esc(e.role)+'<br>'+esc(e.team)+'</p></div></div><span class="tag">Работает с '+fmt(e.start_date)+'</span><div class="section-title employment-title">О чём договорились при найме</div>'+terms(e)+'<div class="note">Эта карточка помогает HR сверить условия при именном обращении. В анонимное сообщение она не передаётся.</div></section><section class="card card-pad"><h3>Как пользоваться этим приложением?</h3><p class="small space-top">Проходите опрос минимум два раза в неделю. Если нужна помощь, можно отвечать чаще.</p><p class="small space-top">Заполните три вопроса, при желании добавьте комментарий и выберите, как отправить ответ: с именем или анонимно. Следите за именным обращением в разделе «Мои обращения». Когда HR решит ваш запрос, подтвердите, помогло ли это.</p><div class="note">Ваши ответы помогают нам замечать сложности и делать вашу работу комфортнее.</div><dl class="terms"><dt>Пройдите первый опрос</dt><dd data-copy-allow>Спустя два рабочих дня после выхода на работу.</dd><dt>Дальше</dt><dd data-copy-allow>Два раза в неделю: через 3 и 2 рабочих дня по графику пн–пт.</dd></dl><p class="muted small space-top">Расписание здесь демонстрационное. Рассылок и напоминаний пока нет. Анонимный ответ не меняет личное расписание.</p></section></aside></div>';
}
function privacy(mode){return mode==='named'?'HR получит ответы с вашим именем. После решения вашего запроса вы сможете подтвердить результат.':'Имя и идентификатор сотрудника не отправляются. Ответ не появится в личной истории; HR не сможет обратиться к вам или запросить подтверждение.'}
function submissionReceipt(){return state.receipt?'<section id="submission-receipt" class="receipt" role="status" tabindex="-1"><h2>'+icon('check')+' Ваш ответ принят</h2><p>'+(state.receipt==='anonymous'?'Вы отправили ответ анонимно. Он передан HR и не появится в «Моих обращениях».':'HR получил ваш ответ. Он появился в списке «Мои обращения». Когда проблема решится, нажмите под ней кнопку «Проблема решена».')+'</p></section>':''}
function employeeReport(r){const solved=r.confirmation==='helped';return '<article class="list-item"><div class="meta"><span class="small muted">'+fmt(r.created_day)+'</span><span class="tag '+(solved?'resolved':'new')+'">'+(solved?'Ваш запрос решён':'Обращение принято')+'</span></div><p>'+esc(r.comment||'Ответы на опрос')+'</p>'+answerList(r,'Мои ответы на опрос')+(solved?'':'<div class="space-top"><button class="btn secondary" data-copy-allow data-confirm="true" data-id="'+r.id+'" data-version="'+r.version+'">Проблема решена</button><p class="small muted no-margin" data-copy-allow>Нажмите, если вам помогли и проблема больше не мешает работать.</p></div>')+'</article>'}
function isResolved(r){return r.kind==='named'?r.confirmation==='helped':r.status==='resolved'}
function hrBadge(r){return '<span class="tag '+(isResolved(r)?'resolved':'work')+'">'+(isResolved(r)?(r.kind==='named'?'Новичок отметил: решено':'Проверено HR'):'Нужна помощь')+'</span>'}
function renderHR(){
 const h=state.hr, filter=state.filter==='all'?'open':state.filter;
 const reports=h.reports.filter(r=>filter==='every'||(filter==='done'?isResolved(r):!isResolved(r))).sort((a,b)=>b.created_day.localeCompare(a.created_day));
 return '<section class="intro hr-intro"><div><div class="eyebrow">Для HR</div><h1>Помощь новичкам</h1><p>Откройте обращение, договоритесь о помощи и запишите результат.</p></div><button class="btn secondary" data-refresh>Обновить обращения</button></section><nav class="hr-simple-filters" aria-label="Какие обращения показать">'+[['open','Нужна помощь'],['done','Решённые'],['every','Все обращения']].map(([id,title])=>'<button class="btn '+(filter===id?'':'secondary')+'" data-hr-filter="'+id+'" aria-pressed="'+(filter===id)+'">'+title+'</button>').join('')+'</nav><div class="hr-cases">'+(reports.length?reports.map(r=>{
 const e=h.employees.find(e=>e.id===r.employee_id),key=r.kind+':'+r.id,opened=state.selected===key;
 return '<article class="card hr-case"><button class="hr-case-toggle" data-open="'+key+'" aria-expanded="'+opened+'"><span class="hr-case-top"><strong>'+esc(e?e.name:'Анонимное обращение')+'</strong>'+hrBadge(r)+'</span><span class="small muted">'+esc(e?e.team:'Имя не передано HR')+' · '+fmt(r.created_day)+'</span><span class="hr-case-message">'+esc(r.comment||'Ответы на опрос без комментария')+'</span>'+(r.due&&!isResolved(r)?'<span class="small muted">Помочь до '+fmt(r.due)+(r.due<today()?' · срок прошёл':'')+'</span>':'')+'<span class="hr-open-label">'+(opened?'Свернуть':'Открыть обращение')+'</span></button>'+(opened?caseDetail(r):'')+'</article>'
 }).join(''):'<section class="card card-pad">'+empty(filter==='done'?'Решённых обращений пока нет':filter==='open'?'Пока никому не нужна помощь':'Обращений пока нет',filter==='open'?'Новые сообщения появятся здесь. Чтобы попробовать, заполните опрос в режиме «Новичок».':'Выберите другой список или дождитесь новых ответов.')+'</section>')+'</div><details class="hr-demo"><summary>Настройки демонстрации</summary><p class="small muted">Все данные вымышлены. Сброс удалит обращения и планы помощи, но сохранит тексты сайта.</p><button class="btn ghost" data-reset>Очистить демо-обращения</button></details>';
}
function caseDetail(r){
 const e=state.hr.employees.find(e=>e.id===r.employee_id),c=state.hr.changes.find(c=>c.source_kind===r.kind&&c.source_id===r.id);
 return '<div class="detail-section">'+answerList(r,'Ответы на опрос')+(e?'<details class="comparison"><summary><strong>Что обещали при найме</strong></summary>'+terms(e)+(e.departed?'<p>Сотрудник уволен. Причина ухода неизвестна.</p>':'<button class="btn ghost" data-depart="'+e.id+'">Демо: отметить увольнение</button>')+'</details>':'<p class="privacy">Это анонимный ответ. Связаться с автором и узнать, помогло ли исправление, не получится. Можно устранить общую проблему и проверить результат самим.</p>')+(e?.departed?'<p class="warning">Человек ушёл, но проблему стоит исправить для следующих новичков. Ниже запишите, что изменим. Само обращение не объясняет причину увольнения.</p>':'')+'</div><div class="detail-section"><h2>Как поможем?</h2><p class="small muted space-top">Запишите один понятный шаг, имя ответственного и срок.</p><form data-help="'+r.kind+':'+r.id+'" class="space-top"><label class="field">Что нужно сделать?<textarea name="action" required maxlength="2000" placeholder="Например: вернуть согласованный график до 18:00">'+esc(r.action)+'</textarea></label><div class="form-grid"><label class="field">Кто поможет?<input name="owner" required maxlength="120" placeholder="Имя и должность" value="'+esc(r.owner)+'"></label><label class="field">До какого дня?<input name="due" type="date" required value="'+esc(r.due||tomorrow())+'"></label></div><label class="field">Что уже сделано?<span class="hint">Можно оставить пустым и вернуться позже.</span><textarea name="result" maxlength="2000" placeholder="Напишите, что удалось исправить">'+esc(r.result)+'</textarea></label>'+(r.kind==='anonymous'?'<label class="field">Как вы проверили результат?<textarea name="verification" maxlength="2000" placeholder="Например: сверили расписание всех новых сотрудников">'+esc(r.hr_check)+'</textarea></label><label class="inline-check"><input type="checkbox" name="resolved" '+(isResolved(r)?'checked':'')+'>Проверил(а): проблема решена</label>':'<p class="note">'+(isResolved(r)?'Новичок уже отметил, что проблема решена.':'Новичок сам нажмёт «Проблема решена» в своём списке. Вам не нужно менять статус.')+'</p>')+'<input type="hidden" name="version" value="'+r.version+'"><button class="btn space-top" type="submit">Сохранить помощь</button></form></div><div class="detail-section"><details '+(e?.departed||c?'open':'')+'><summary><strong>Чтобы это не повторилось</strong></summary><p class="small muted space-top">Если проблема может возникнуть снова, запишите, что нужно поменять для следующих новичков.</p><form data-process="'+r.kind+':'+r.id+'" class="process-form"><label class="field">Что изменим?<textarea name="action" required maxlength="2000" placeholder="Например: указывать точный график в предложении о работе">'+esc(c?.action||'')+'</textarea></label><div class="form-grid"><label class="field">Кто это сделает?<input name="owner" required maxlength="120" value="'+esc(c?.owner||'')+'"></label><label class="field">До какого дня?<input name="due" type="date" required value="'+esc(c?.due||tomorrow())+'"></label></div><label class="field">Как поймём, что стало лучше?<textarea name="verification" required maxlength="2000" placeholder="Например: спросим следующих трёх новичков, совпал ли график">'+esc(c?.verification||'')+'</textarea></label><label class="field">Что показала проверка?<span class="hint">Заполните, когда проверите.</span><textarea name="evidence" maxlength="2000">'+esc(c?.evidence||'')+'</textarea></label><label class="inline-check"><input name="done" type="checkbox" '+(c?.done?'checked':'')+'>Изменили и проверили</label><button class="btn secondary" type="submit">Сохранить план</button></form></details></div>';
}
function render(){saveDrafts();document.querySelectorAll('[data-role]').forEach(b=>{b.classList.toggle('active',b.dataset.role===state.role);b.setAttribute('aria-pressed',String(b.dataset.role===state.role))});app.innerHTML=state[state.role]?(state.role==='employee'?renderEmployee():renderHR()):'<section class="card card-pad"><h1>'+(state.role==='hr'?'Помощь новичкам':'Опрос для новичков')+'</h1><p role="status" class="muted space-top">'+esc(state.loadError[state.role]||'Загружаем данные…')+'</p></section>';restoreDrafts();$('#error').textContent='';state.mode='named';applyCopy()}
document.addEventListener('input',e=>{if(e.target.closest('#app form')){state.dirty[state.role]=true;e.target.closest('form').dataset.dirty='true'}});
document.addEventListener('change',e=>{
  if(e.target.name==='mode'){state.mode=e.target.value;$('#privacy').innerHTML=privacy(state.mode);$('#send-button').innerHTML=(state.mode==='named'?'Отправить с именем':'Отправить анонимно')+' '+icon('arrow')+''}
  if(e.target.name==='mode')applyCopy();
  if(e.target.id==='filter'){state.filter=e.target.value;render()}
});
document.addEventListener('click',async event=>{
  const button=event.target.closest('button');if(!button||copyEditor.active)return;
  try{
    if(button.dataset.role){saveDrafts();state.role=button.dataset.role;render();const role=state.role;void loadRole(role).then(()=>{if(state.role===role&&!state.dirty[role])render()}).catch(error=>{state.loadError[role]=error.message;if(state.role===role&&!state.dirty[role]){render();notify(error.message,true)}});return}
    if(button.dataset.tab){state.tab=button.dataset.tab;render();return}
    if(button.dataset.open){state.selected=state.selected===button.dataset.open?null:button.dataset.open;render();return}
    if(button.dataset.hrFilter){state.filter=button.dataset.hrFilter;state.selected=null;render();return}
    if(button.hasAttribute('data-example')){const f=$('#survey-form');f.dataset.dirty='true';state.dirty.employee=true;[0,1,1].forEach((v,i)=>f.elements['q'+i].value=v);f.elements.comment.value='При найме договорились о графике 5/2 с 09:00 до 18:00. В расписании на эту неделю стоят смены до 22:00. Помогите вернуть согласованный график.';notify('Пример заполнен. Проверьте ответы и выберите способ отправки.');return}
    if(button.hasAttribute('data-confirm')){button.disabled=true;await api('reports/named/'+button.dataset.id+'/confirm',{helped:button.dataset.confirm==='true',version:Number(button.dataset.version)});await refresh();notify(button.dataset.confirm==='true'?'Готово. Ваш запрос отмечен как решённый.':'HR увидит, что проблема осталась. Обращение снова в работе.');return}
    if(button.dataset.depart){if(!confirm('Отметить увольнение в демо? Обращения сохранятся. Причина увольнения останется неизвестной.'))return;await api('employee/depart',{employee_id:button.dataset.depart});await refresh();notify('Увольнение отмечено. Обращения и изменения процесса сохранены.');return}
    if(button.hasAttribute('data-refresh')){state.drafts={};document.querySelectorAll('#app form').forEach(f=>f.dataset.saved='true');state.dirty[state.role]=false;await refresh();notify('Данные обновлены.');return}
    if(button.hasAttribute('data-reset')){if(!confirm('Удалить все обращения и изменения этого демо и вернуть исходных вымышленных сотрудников?'))return;await api('demo/reset',{confirm:'reset-demo'});state.selected=null;await refresh();notify('Демонстрационные данные сброшены.');return}
  }catch(error){notify(error.message,true);button.disabled=false}
});
document.addEventListener('submit',async event=>{
  const form=event.target;event.preventDefault();if(copyEditor.active)return;const button=form.querySelector('button[type="submit"]'), values=Object.fromEntries(new FormData(form));
  button.disabled=true;
  try{
    if(form.id==='survey-form'){
      if([0,1,2].some(i=>values['q'+i]===undefined))throw new Error('Ответьте на все три вопроса.');
      const payload={answers:[0,1,2].map(i=>options[i][Number(values['q'+i])]),comment:values.comment||''};
      const anonymous=values.mode==='anonymous';
      if(!anonymous)payload.employee_id=state.employee.employee.id;
      state.receipt=null;$('#submission-receipt')?.remove();
      await api(anonymous?'anonymous':'named',payload,anonymous);
      state.receipt=anonymous?'anonymous':'named';form.reset();form.dataset.saved='true';state.dirty.employee=false;render();
      try{await refresh()}catch{notify('Ваш ответ принят. Чтобы увидеть обновлённый список, обновите страницу.',true)}
      const receipt=$('#submission-receipt');receipt?.focus();receipt?.scrollIntoView({behavior:'smooth',block:'start'});
    }else if(form.dataset.help){const [kind,id]=form.dataset.help.split(':');await api('reports/'+kind+'/'+id+'/help',{version:Number(values.version),owner:values.owner,due:values.due,action:values.action,result:values.result,verification:values.verification||'',resolved:values.resolved==='on'});form.dataset.saved='true';state.dirty.hr=false;await refresh();notify('Помощь сохранена.');
    }else if(form.dataset.manage){const [kind,id]=form.dataset.manage.split(':');await api('reports/'+kind+'/'+id+'/manage',{...values,version:Number(values.version)});await refresh();notify(values.status==='check'?'Исправление передано на проверку.':'Действие сохранено.');
    }else if(form.dataset.process){const [kind,id]=form.dataset.process.split(':');await api('reports/'+kind+'/'+id+'/process',{...values,done:values.done==='on'});form.dataset.saved='true';state.dirty.hr=false;await refresh();notify('Изменение процесса сохранено в разделе «Изменения».')}
  }catch(error){notify(error.message,true);button.disabled=false}
});
/* EDITOR_CLIENT */
async function boot(){try{await api('demo/init',{});await Promise.all([loadCopy(),loadRole('employee')]);render();void loadRole('hr').catch(()=>{});if(editorPage&&copyEditor.enabled)$('#copy-toggle').click()}catch(error){$('#error').innerHTML=esc(error.message)+' <button class="btn secondary" id="retry">Повторить загрузку</button>';app.innerHTML='';$('#retry').onclick=boot}}
boot();
</script>
